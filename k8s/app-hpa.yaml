apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mecanica-billing-service
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: mecanica-billing-service}
  minReplicas: 1
  maxReplicas: 2
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
